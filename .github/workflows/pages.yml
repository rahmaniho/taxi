name: انتشار آنلاین (GitHub Pages)

# هدف: بالا آمدن نسخهٔ آنلاین سامانه روی نشانی
#   https://rahmaniho.github.io/taxi/
# کل مخزن منتشر می‌شود؛ صفحهٔ ریشه (index.html) کاربر را خودکار به برنامه
# (legacy/taxi.html) می‌برد.
#
# نکتهٔ مهم دربارهٔ فعال‌سازی (یک‌بار برای همیشه):
#   ساخت سایت Pages از طریق API با توکن‌های این محیط مجاز نیست (پاسخ ۴۰۳)، پس
#   اگر Pages هنوز فعال نشده باشد این گردش‌کار «هشدار» می‌دهد و متوقف می‌شود
#   (بدون شکست قرمز). برای فعال‌سازی:
#     Settings → Pages → Source: «GitHub Actions» → Save
#   سپس همین گردش‌کار را از تب Actions با «Run workflow» اجرا کنید.
#   اگر Pages با منبع «Deploy from a branch» فعال باشد، انتشار خودکار انجام
#   می‌شود و این گردش‌کار کاری نمی‌کند.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: انتشار نسخهٔ آنلاین
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: بررسی وضعیت GitHub Pages
        id: check
        run: |
          set +e
          info=$(gh api "repos/${{ github.repository }}/pages" 2>&1)
          echo "$info" | head -c 400
          if echo "$info" | grep -q '"build_type":"workflow"'; then
            echo "mode=workflow" >> "$GITHUB_OUTPUT"
          elif echo "$info" | grep -q '"html_url"'; then
            echo "mode=branch" >> "$GITHUB_OUTPUT"
            url=$(echo "$info" | sed -n 's/.*"html_url":"\([^"]*\)".*/\1/p')
            {
              echo "### GitHub Pages فعال است (منبع: شاخه)"
              echo ""
              echo "برنامه روی این نشانی منتشر می‌شود: $url"
              echo ""
              echo "مسیر برنامه: \`${url%/}/legacy/taxi.html\` — ورود پیش‌فرض: \`admin\` / \`admin\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages فعال نیست::برای انتشار آنلاین: Settings → Pages → Source: GitHub Actions → Save و سپس این گردش‌کار را دوباره اجرا کنید. نشانی نهایی: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            {
              echo "### GitHub Pages فعال نیست"
              echo ""
              echo "برای بالا آمدن نسخهٔ آنلاین، یک‌بار این مسیر را انجام دهید:"
              echo ""
              echo "1. **Settings → Pages**"
              echo "2. در بخش **Source** گزینهٔ **GitHub Actions** را انتخاب و Save کنید"
              echo "3. از تب **Actions** همین گردش‌کار را با **Run workflow** اجرا کنید (یا یک commit به main بزنید)"
              echo ""
              echo "نشانی نهایی: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: دریافت مخزن
        if: steps.check.outputs.mode == 'workflow'
        uses: actions/checkout@v4

      - name: پیکربندی GitHub Pages
        if: steps.check.outputs.mode == 'workflow'
        uses: actions/configure-pages@v5

      - name: بسته‌بندی کل مخزن برای انتشار
        if: steps.check.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: انتشار روی GitHub Pages
        if: steps.check.outputs.mode == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v4
