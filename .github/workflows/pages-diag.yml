name: تشخیص فعال‌سازی Pages (موقت)

# این گردش‌کار موقتی است: نتیجهٔ فراخوانی API مربوط به GitHub Pages را در یک
# «ایشو» می‌نویسد تا محدودیت دقیق مشخص شود (لاگ Actions در محیط توسعه در دسترس نیست).
# پس از تشخیص، این فایل حذف خواهد شد.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-diag.yml'

permissions:
  contents: read
  issues: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: خواندن وضعیت Pages
        run: |
          set +e
          {
            echo "## تشخیص GitHub Pages"
            echo ""
            echo '### GET /repos/${{ github.repository }}/pages'
            echo '```'
            gh api "repos/${{ github.repository }}/pages" 2>&1 | head -c 1200
            echo '```'
            echo '### POST /repos/${{ github.repository }}/pages (build_type=workflow)'
            echo '```'
            gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow 2>&1 | head -c 1200
            echo '```'
            echo '### POST /repos/${{ github.repository }}/pages (source=main)'
            echo '```'
            gh api -X POST "repos/${{ github.repository }}/pages" -f 'source[branch]=main' -f 'source[path]=/' 2>&1 | head -c 1200
            echo '```'
            echo "run: ${{ github.run_id }}"
          } > pages-diag.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ثبت نتیجه در ایشو
        run: |
          gh api -X POST "repos/${{ github.repository }}/issues" \
            -f title="تشخیص فعال‌سازی GitHub Pages (موقت)" \
            -f body="$(cat pages-diag.md)" >/dev/null && echo "issue created"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
